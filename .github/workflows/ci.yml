name: CI

# Build/compile each language SDK and run the python + typescript behavioral
# test suites. Runs on every PR and on pushes to main, providing status checks
# that branch protection can require before merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build & import
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          python -c "import znyx_sdk; print('znyx_sdk OK')"
      # Behavioral tests against a local stub HTTP server: auth headers, the
      # per-stage evaluate methods, error mapping, retries, contract-validation
      # outcomes and SSE streaming. Required for merge via branch protection.
      - name: Behavioral tests
        working-directory: python
        run: python -m pytest tests -q

  typescript:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Build
        working-directory: typescript
        run: |
          npm ci
          npm run build
      # Behavioral tests (jest) against a local stub HTTP server, mirroring
      # the python suite. Required for merge via branch protection.
      - name: Behavioral tests
        working-directory: typescript
        run: npm test

  npm-runtime:
    name: npm runtime wrapper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # Plain `node --test`, no install step: the wrapper has no dependencies
      # and running npm install here would trigger the postinstall download.
      - name: Test installer verification logic
        working-directory: npm-runtime
        run: node --test

  java:
    name: Java build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Compile
        working-directory: java
        run: mvn -B -ntp compile

  csharp:
    name: C# build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "6.0.x"
      - name: Build
        working-directory: csharp
        run: dotnet build -c Release

  ruby:
    name: Ruby build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check & gem build
        working-directory: ruby
        run: |
          ruby --version
          find lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c
          gem build znyx-sdk.gemspec

  rust:
    name: Rust build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build & test
        working-directory: rust
        run: |
          cargo --version
          cargo build --verbose
          cargo test --verbose
